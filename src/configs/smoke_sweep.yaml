# Tiny end-to-end check of the sweep pipeline (minutes): 2 configurations x 2 seeds, short training and BRs.
#   python sweep.py --config configs/smoke_sweep.yaml --out_dir runs/smoke_sweep --jobs 4
grid: {}
variants:
  - {}
  - grid: {ent_coef: [0.0]}
seeds: [0, 1]
fixed:
  penalty: none
  clip_policy: true
  ent_coef: 0.01
  clip_coef: 0.1
  lr: 0.00025
  anneal_lr: true
  num_envs: 8
  num_steps: 128
  num_minibatches: 4
  update_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  vf_coef: 0.5
  max_grad_norm: 0.5
  norm_adv: true
  clip_vloss: true
  target_kl: null
  hidden: [512, 512, 512]
  total_steps: 40960
  zero_sum: true
  share_vel: true
  symmetric: true
  max_cycles: 25
  threads: 1
  device: cpu
br:
  steps: 20480
  seeds: 2
  seed: 10000
  episodes: 20
  eval_seed: 100000
  report_seed: 200000
  init: warm
  args: '--ent_coef 0 --clip_coef 0.1 --penalty none'
comparisons:
  episodes: 20
  seed: 300000
